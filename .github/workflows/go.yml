name: Go

on:
  push:
  pull_request:
    branches: ["master"]
    types:
      - opened
      - synchronize
      - reopened
      - review_requested
  pull_request_review:
    types:
      - submitted
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -count=1 -timeout=2m ./...

      - name: Static checks
        run: go vet ./...

      - name: CLI integration checks
        run: |
          go build -o "$RUNNER_TEMP/commitlint" .
          bash test/integration_test.sh "$RUNNER_TEMP/commitlint"
